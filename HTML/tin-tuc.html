<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tin Tức〡LPTSHOP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script>try{document.documentElement.dataset.theme=localStorage.getItem("lpt_theme")||"light"}catch(e){}</script>
  <link rel="stylesheet" href="/CSS/chung.css" />
  <link rel="stylesheet" href="/CSS/modal-auth.css" />
  <link rel="stylesheet" href="/CSS/tin-tuc.css" />
</head>
<body>
  <div id="site-header"></div>

  <main>
    <div class="container news-page">
      <div class="news-head">
        <div class="news-kicker">LPTSHOP</div>
        <h1>TIN TỨC &amp; THÔNG BÁO</h1>
        <p>Cập nhật sự kiện, ưu đãi và hướng dẫn mới nhất từ LPTSHOP.</p>
      </div>

      <div class="news-tools">
        <div class="news-chips" id="newsChips"></div>
        <label class="news-search">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input type="search" id="newsSearch" placeholder="Tìm bài viết..." aria-label="Tìm bài viết">
        </label>
      </div>

      <div id="newsFeatured"></div>
      <div class="news-grid" id="newsGrid"></div>
      <p class="news-empty" id="newsEmpty" hidden>Không tìm thấy bài viết phù hợp.</p>
      <button type="button" class="news-load" id="newsLoad" hidden>Xem thêm bài viết</button>
    </div>
  </main>

  <div class="news-modal" id="newsModal" aria-hidden="true">
    <article class="news-article" role="dialog" aria-modal="true" aria-labelledby="newsArticleTitle">
      <button type="button" class="news-close" id="newsClose" aria-label="Đóng">×</button>
      <div id="newsArticle"></div>
    </article>
  </div>

  <div id="site-footer"></div>
  <script src="/JS/layout.js"></script>
  <script src="/JS/tin-tuc.js"></script>
</body>
</html>
