<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nạp Tiền〡LPTSHOP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script>try{document.documentElement.dataset.theme=localStorage.getItem("lpt_theme")||"light"}catch(e){}</script>
  <link rel="stylesheet" href="/CSS/chung.css" />
  <link rel="stylesheet" href="/CSS/modal-auth.css" />
  <link rel="stylesheet" href="/CSS/nap-tien.css" />
</head>
<body>
  <div id="site-header"></div>

  <main>
    <div class="container deposit-page">
      <div class="deposit-tabs">
        <button type="button" class="deposit-tab active" data-tab="the">Nạp Thẻ Cào</button>
        <button type="button" class="deposit-tab" data-tab="bank">Chuyển Khoản</button>
      </div>

      <!-- TAB: NẠP THẺ -->
      <div class="deposit-layout deposit-tab-panel" id="panel-the">
        <div class="deposit-panel">
          <div class="section-title">
            <div class="section-icon">
              <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect x="2" y="5" width="20" height="14" rx="2.5" stroke="currentColor" stroke-width="1.8"/>
                <line x1="2" y1="9.5" x2="22" y2="9.5" stroke="currentColor" stroke-width="1.8"/>
              </svg>
            </div>
            <h2>Nạp thẻ cào tự động</h2>
          </div>

          <div class="form-group">
            <label>Chọn loại thẻ</label>
            <div class="dropdown-select" id="cardTypeDropdown">
              <button type="button" class="dropdown-toggle" id="cardTypeToggle">
                <span id="cardTypeLabel">Viettel</span>
                <span class="dropdown-arrow">▾</span>
              </button>
              <div class="dropdown-menu" id="cardTypeMenu">
                <button type="button" class="dropdown-option active" data-card="Viettel">Viettel</button>
                <button type="button" class="dropdown-option" data-card="Vinaphone">Vinaphone</button>
                <button type="button" class="dropdown-option" data-card="Mobifone">Mobifone</button>
                <button type="button" class="dropdown-option" data-card="Garena">Garena</button>
                <button type="button" class="dropdown-option" data-card="Zing">Zing</button>
                <button type="button" class="dropdown-option" data-card="Gate">Gate</button>
                <button type="button" class="dropdown-option" data-card="Vietnamobile">Vietnamobile</button>
                <button type="button" class="dropdown-option" data-card="Vcoin">Vcoin</button>
              </div>
            </div>
          </div>

          <div class="form-group">
            <label>Mệnh giá</label>
            <div class="amount-grid" id="amountGrid">
              <button type="button" class="amount-btn active" data-amount="10000">10.000đ</button>
              <button type="button" class="amount-btn" data-amount="20000">20.000đ</button>
              <button type="button" class="amount-btn" data-amount="50000">50.000đ</button>
              <button type="button" class="amount-btn" data-amount="100000">100.000đ</button>
              <button type="button" class="amount-btn" data-amount="200000">200.000đ</button>
              <button type="button" class="amount-btn" data-amount="500000">500.000đ</button>
            </div>
          </div>

          <div class="form-group">
            <label>Mã thẻ</label>
            <input type="text" class="form-control" id="cardCode" placeholder="Nhập mã thẻ">
          </div>

          <div class="form-group">
            <label>Số Serial</label>
            <input type="text" class="form-control" id="cardSerial" placeholder="Nhập số serial">
          </div>

          <button type="button" class="submit-btn" id="submitCardBtn">Nạp Thẻ</button>
        </div>
      </div>

      <!-- TAB: Chuyển Khoảng -->
      <div class="deposit-layout deposit-tab-panel" id="panel-bank" style="display:none;">
          <div class="deposit-panel">
            <div class="section-title">
              <div class="section-icon">
                <img src="https://cdn.vietqr.io/img/MB.png" alt="MBBank" />
              </div>
              <div class="section-title-text">
                <h2>MBBank</h2>
                <p>Ngân hàng Thương Mại Cổ Phần Quân Đội</p>
              </div>
            </div>

          <div class="qr-box">
            <img src="/Uploads/QR.png" alt="QR chuyển khoản" onerror="this.style.display='none'">
          </div>

          <div class="bank-info-box">
            <div class="bank-info-row">
              <span>Chủ Tài Khoản</span>
              <b>LY PHUC THIEN</b>
            </div>
            <div class="bank-info-row">
              <span>Số Tài Khoản</span>
              <b id="infoAccount"> 0946518312</b>
              <button type="button" class="copy-btn" id="copyAccountBtn" aria-label="Sao chép">
                <svg class="icon-copy" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <rect x="9" y="9" width="12" height="12" rx="2" stroke="currentColor" stroke-width="1.8"/>
                  <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" stroke="currentColor" stroke-width="1.8"/>
                </svg>
                <svg class="icon-check" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <path d="M4 12l6 6L20 6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
              </button>
            </div>
            <div class="bank-info-row">
              <span>Nội Dung Chuyển</span>
              <b id="infoContent">LPTSHOP-12345</b>
              <button type="button" class="copy-btn" id="copyContentBtn" aria-label="Sao chép">
                <svg class="icon-copy" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <rect x="9" y="9" width="12" height="12" rx="2" stroke="currentColor" stroke-width="1.8"/>
                  <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" stroke="currentColor" stroke-width="1.8"/>
                </svg>
                <svg class="icon-check" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <path d="M4 12l6 6L20 6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
              </button>
            </div>
          </div>

          <button type="button" class="submit-btn" id="submitBankBtn">Xác Nhận Đã Chuyển</button>

          <div class="note-box">
            ⚠ Vui lòng ghi đúng nội dung chuyển khoản. Tiền được cộng tự động sau 1-2 phút; sai nội dung sẽ không được cộng tự động.
          </div>
        </div>
      </div>
    </div>
  </main>

  <div id="site-footer"></div>
  <script src="/JS/layout.js"></script>

  <script>
    // ===== Chuyển tab NẠP THẺ / NGÂN HÀNG =====

    const tabButtons = document.querySelectorAll('.deposit-tab');
    const panels = {
      the: document.getElementById('panel-the'),
      bank: document.getElementById('panel-bank')
    };

    function activateTab(tab) {
      tabButtons.forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
      panels.the.style.display = tab === 'the' ? '' : 'none';
      panels.bank.style.display = tab === 'bank' ? '' : 'none';
    }

    tabButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        const tab = btn.dataset.tab;
        activateTab(tab);

        const targetUrl = tab === 'bank'
          ? '/nap-tien/chuyen-khoan'
          : '/nap-tien/nap-the';

        if (window.location.pathname !== targetUrl) {
          history.pushState(null, '', targetUrl);
        }
      });
    });

    let initialTab = 'the';

    if (window.location.pathname === '/nap-tien/chuyen-khoan') {
      initialTab = 'bank';
    } else if (window.location.pathname === '/nap-tien/nap-the') {
      initialTab = 'the';
    }

    // Không đổi URL ở đây
    activateTab(initialTab);

    // Back / Forward
    window.addEventListener('popstate', () => {
      let tab = 'the';

      if (window.location.pathname === '/nap-tien/chuyen-khoan') {
        tab = 'bank';
      } else if (window.location.pathname === '/nap-tien/nap-the') {
        tab = 'the';
      }

      activateTab(tab);
    });

    // ===== Toast =====
    const cardTypeDropdown = document.getElementById('cardTypeDropdown');
    const cardTypeToggle = document.getElementById('cardTypeToggle');
    const cardTypeMenu = document.getElementById('cardTypeMenu');
    const cardTypeLabel = document.getElementById('cardTypeLabel');

    cardTypeToggle.addEventListener('click', () => {
      cardTypeDropdown.classList.toggle('open');
    });

    cardTypeMenu.addEventListener('click', e => {
      const opt = e.target.closest('.dropdown-option');
      if (!opt) return;

      cardTypeMenu.querySelectorAll('.dropdown-option').forEach(o => o.classList.remove('active'));
      opt.classList.add('active');
      cardTypeLabel.textContent = opt.textContent.trim();
      cardTypeDropdown.classList.remove('open');
    });

    document.addEventListener('click', e => {
      if (!cardTypeDropdown.contains(e.target)) {
        cardTypeDropdown.classList.remove('open');
      }
    });

    // ===== Lưới chọn mệnh giá =====
    const amountGrid = document.getElementById('amountGrid');

    amountGrid.addEventListener('click', e => {
      const btn = e.target.closest('.amount-btn');
      if (!btn) return;

      amountGrid.querySelectorAll('.amount-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    });

    // ===== NGÂN HÀNG =====
    function markCopied(btn) {
      btn.classList.add('copied');
      clearTimeout(btn._copyTimer);

      btn._copyTimer = setTimeout(() => {
        btn.classList.remove('copied');
      }, 2000);
    }

    function fallbackCopy(text, btn, successMsg) {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.focus();
      ta.select();

      try {
        const ok = document.execCommand('copy');

        if (ok) {
          markCopied(btn);
          showToast(successMsg);
        } else {
          showToast('Không thể sao chép, vui lòng chọn và copy thủ công.');
        }
      } catch (err) {
        showToast('Không thể sao chép, vui lòng chọn và copy thủ công.');
      }

      document.body.removeChild(ta);
    }

    function copyText(text, btn, successMsg) {
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(text)
          .then(() => {
            markCopied(btn);
            showToast(successMsg);
          })
          .catch(() => fallbackCopy(text, btn, successMsg));
      } else {
        fallbackCopy(text, btn, successMsg);
      }
    }

    document.getElementById('copyAccountBtn').addEventListener('click', e => {
      copyText(
        document.getElementById('infoAccount').textContent.trim(),
        e.currentTarget,
        'Đã sao chép số tài khoản.'
      );
    });

    document.getElementById('copyContentBtn').addEventListener('click', e => {
      copyText(
        document.getElementById('infoContent').textContent.trim(),
        e.currentTarget,
        'Đã sao chép nội dung chuyển khoản.'
      );
    });

    // ===== Xác nhận chuyển khoản =====
    document.getElementById('submitBankBtn').addEventListener('click', () => {
      if (!requireLogin()) return;
      const btn = document.getElementById('submitBankBtn');
      btn.disabled = true;
      showToast('Đang kiểm tra giao dịch...');
      const start = me.balance;
      let tries = 0;
      const timer = setInterval(async () => {
        tries += 1;
        try {
          const p = await apiCall('/api/auth/profile', { method: 'GET' });
          if (p.balance > start) {
            clearInterval(timer);
            btn.disabled = false;
            me = p;
            showToast('Đã nhận ' + formatVND(p.balance - start) + '. Số dư mới: ' + formatVND(p.balance));
            window.dispatchEvent(new Event('lpt:balance'));
          } else if (tries >= 24) {
            clearInterval(timer);
            btn.disabled = false;
            showToast('Chưa thấy giao dịch. Nếu bạn đã chuyển khoản, số dư sẽ tự cộng sau ít phút.');
          }
        } catch (err) { /* lỗi mạng tạm thời, thử lại lượt sau */ }
      }, 5000);
    });

    // ===== Nạp thẻ (API thật — doithegiatot.com) =====
    async function apiCall(url, opts) {
      const res = await fetch(url, { headers: { 'Content-Type': 'application/json' }, ...opts });
      let data = {};
      try { data = await res.json(); } catch (e) {}
      if (!res.ok) throw new Error(data.error || 'Đã có lỗi xảy ra.');
      return data;
    }

    const formatVND = n => Number(n || 0).toLocaleString('vi-VN') + 'đ';

    // ===== Tài khoản đang đăng nhập (ID, số dư) =====
    let me = null;

    function requireLogin() {
      if (me) return true;
      showToast('Vui lòng đăng nhập để nạp tiền.');
      if (window.LPT_AUTH_MODAL) window.LPT_AUTH_MODAL.open('login');
      return false;
    }

    function renderBank() {
      const content = document.getElementById('infoContent');
      const qr = document.querySelector('#panel-bank .qr-box img');
      if (!me) {
        content.textContent = 'Đăng nhập để lấy nội dung';
        return;
      }
      const text = 'LPT' + me.uid;
      content.textContent = text;
      if (qr) {
        const account = document.getElementById('infoAccount').textContent.trim();
        qr.src = 'https://img.vietqr.io/image/MB-' + account + '-compact2.png?addInfo=' + encodeURIComponent(text) +
          '&accountName=' + encodeURIComponent('LY PHUC THIEN');
        qr.style.display = '';
      }
    }

    async function loadMe() {
      try { me = await apiCall('/api/auth/profile', { method: 'GET' }); } catch (e) { me = null; }
      renderBank();
    }
    let cardPollTimer = null;

    function stopCardPolling() {
      if (cardPollTimer) { clearInterval(cardPollTimer); cardPollTimer = null; }
    }

    function finishCard(btn, msg) {
      stopCardPolling();
      btn.disabled = false;
      showToast(msg);
    }

    function pollCardResult(requestId, btn) {
      stopCardPolling();
      let tries = 0;
      cardPollTimer = setInterval(async () => {
        tries += 1;
        try {
          const d = await apiCall('/api/napthe/status?requestId=' + requestId, { method: 'GET' });
          if (d.status === 'success') {
            loadMe();
            window.dispatchEvent(new Event('lpt:balance'));
            finishCard(btn, d.wrongPrice
              ? 'Thẻ đúng nhưng sai mệnh giá. Giá trị thực nhận: ' + formatVND(d.realAmount)
              : 'Nạp thẻ thành công! Giá trị thực nhận: ' + formatVND(d.realAmount));
          } else if (d.status === 'failed') {
            finishCard(btn, d.message || 'Thẻ không hợp lệ hoặc sai thông tin.');
          } else if (d.status === 'expired' || tries >= 60) {
            finishCard(btn, 'Thẻ xử lý lâu hơn bình thường, vui lòng kiểm tra lại sau ít phút.');
          }
        } catch (err) { /* lỗi mạng tạm thời, thử lại lượt sau */ }
      }, 3000);
    }

    document.getElementById('submitCardBtn').addEventListener('click', async () => {
      const btn = document.getElementById('submitCardBtn');
      if (!requireLogin()) return;
      const telco = cardTypeMenu.querySelector('.dropdown-option.active').dataset.card;
      const code = document.getElementById('cardCode').value.trim();
      const serial = document.getElementById('cardSerial').value.trim();
      const activeAmount = amountGrid.querySelector('.amount-btn.active');
      const amount = activeAmount ? Number(activeAmount.dataset.amount) : 0;

      if (!code) { showToast('Vui lòng nhập mã thẻ.'); document.getElementById('cardCode').focus(); return; }
      if (!serial) { showToast('Vui lòng nhập số serial.'); document.getElementById('cardSerial').focus(); return; }
      if (!amount) { showToast('Vui lòng chọn mệnh giá.'); return; }

      btn.disabled = true;
      try {
        const d = await apiCall('/api/napthe/submit', {
          method: 'POST',
          body: JSON.stringify({ telco, code, serial, amount }),
        });
        if (d.status === 'pending') {
          showToast('Đã gửi thẻ, đang chờ xử lý...');
          pollCardResult(d.requestId, btn);
        } else {
          btn.disabled = false;
          showToast(d.message || 'Gửi thẻ thất bại.');
        }
        document.getElementById('cardCode').value = '';
        document.getElementById('cardSerial').value = '';
      } catch (err) {
        btn.disabled = false;
        showToast(err.message);
      }
    });

    loadMe();
    const accDrop = document.querySelector('.acc-dropdown');
    if (accDrop) new MutationObserver(loadMe).observe(accDrop, { childList: true, subtree: true });
  </script>
</body>
</html>
