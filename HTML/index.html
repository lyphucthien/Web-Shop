<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LPTSHOP - Nơi Bán Chính Thức Của LPT</title>
  <meta name="description" content="LPTSHOP — giao diện cửa hàng sản phẩm số hiện đại." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script>try{document.documentElement.dataset.theme=localStorage.getItem("lpt_theme")||"light"}catch(e){}</script>
  <link rel="stylesheet" href="/CSS/chung.css" />
  <link rel="stylesheet" href="/CSS/modal-auth.css" />
</head>
<body>
  <div id="site-header"></div>

  <main id="home">
    <section class="showcase">
      <div class="container showcase-inner">
        <div class="hero-carousel" id="heroCarousel">
          <div class="carousel-track" id="carouselTrack">
            <article class="promo-slide promo-image-slide">
              <img src="/Uploads/Welcome.png" alt="Sự kiện nổi bật">
              <div class="promo-overlay">
                <a href="/products" class="promo-cta">Xem sản phẩm →</a>
              </div>
            </article>
          </div>
          <button class="carousel-arrow arrow-prev" id="carouselPrev" aria-label="Slide trước">‹</button>
          <button class="carousel-arrow arrow-next" id="carouselNext" aria-label="Slide sau">›</button>
          <div class="carousel-dots" id="carouselDots"></div>
        </div>

        <div class="login-strip">
          <span class="user-circle">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          </span>
          <div class="login-copy">
            <strong>Xin chào!</strong>
            <small>Vui lòng đăng nhập để thực hiện mua hàng và xem số dư</small>
          </div>
          <div class="login-actions">
            <button class="login-btn" data-modal="login">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
              &nbsp;Đăng Nhập
            </button>
            <button class="register-btn" data-modal="register">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="17" y1="11" x2="23" y2="11"/></svg>
              &nbsp;Đăng Ký
            </button>
          </div>
        </div>
      </div>
    </section>

    <section id="categories" class="container section">
      <div class="category-grid">
        <button class="category-card" data-filter="BloxFruit">
          <img class="cat-icon-img" src="https://res.cloudinary.com/dkui88bcf/image/upload/v1786939501/Logo_LPT_vnq390.png" onerror="this.style.display='none'">
          <b>Túi Mù BLOX FRUIT - 100% Acc QUỐC TẾ</b>
        </button>
      </div>
    </section>

    <section id="products" class="container section products-section">
      <div class="section-head">
        <div><h2>TÚI MÙ BLOX FRUIT SIÊU MÚP</h2></div>
      </div>
      <div id="productGrid" class="product-grid"></div>
    </section>
  </main>

  <div id="site-footer"></div>
  <script src="/JS/layout.js"></script>
</body>
</html>
