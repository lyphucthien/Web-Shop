<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Đăng Nhập〡LPTSHOP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script>try{document.documentElement.dataset.theme=localStorage.getItem("lpt_theme")||"light"}catch(e){}</script>
  <link rel="stylesheet" href="/CSS/chung.css" />
  <link rel="stylesheet" href="/CSS/dang-nhap.css" />
</head>
<body class="lg-page">
  <header class="lg-top">
    <a href="/" class="lg-back">← Về trang chủ</a>
    <button class="circle-btn icon-accent" id="themeToggle" aria-label="Đổi giao diện">
      <svg class="icon-moon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      <svg class="icon-sun" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
    </button>
  </header>

  <main class="lg-main">
    <section class="lg-card">
      <h1 class="lg-title">LPTSHOP</h1>
      <p class="lg-sub" id="lgSub">Đăng nhập để mua hàng và xem số dư</p>

      <div class="lg-tabs">
        <button type="button" class="lg-tab active" data-tab="dang-nhap">Đăng Nhập</button>
        <button type="button" class="lg-tab" data-tab="dang-ky">Đăng Ký</button>
      </div>

      <form id="lgForm" novalidate>
        <label for="lgUser">Tên đăng nhập</label>
        <input id="lgUser" type="text" maxlength="20" autocomplete="username" placeholder="vd: lptshop_01">

        <label for="lgPass">Mật khẩu</label>
        <div class="lg-pass">
          <input id="lgPass" type="password" maxlength="64" autocomplete="current-password" placeholder="Ít nhất 6 ký tự">
          <button type="button" class="lg-eye" id="lgEye" aria-label="Hiện mật khẩu">👁</button>
        </div>

        <div id="lgConfirmWrap" hidden>
          <label for="lgPass2">Nhập lại mật khẩu</label>
          <input id="lgPass2" type="password" maxlength="64" autocomplete="new-password" placeholder="Nhập lại mật khẩu">
        </div>

        <div class="lg-error" id="lgError"></div>
        <button type="submit" class="lg-submit" id="lgSubmit">Đăng Nhập</button>
      </form>

      <p class="lg-switch" id="lgSwitch">Chưa có tài khoản? <a href="/tai-khoan/dang-ky">Đăng ký ngay</a></p>
    </section>
  </main>

  <div id="toast" class="toast"></div>
  <script src="/JS/script.js"></script>
  <script src="/JS/tai-khoan.js"></script>
</body>
</html>
