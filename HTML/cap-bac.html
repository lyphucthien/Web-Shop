<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hệ Thống Cấp Bậc〡LPTSHOP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script>try{document.documentElement.dataset.theme=localStorage.getItem("lpt_theme")||"light"}catch(e){}</script>
  <link rel="stylesheet" href="/CSS/chung.css" />
  <link rel="stylesheet" href="/CSS/modal-auth.css" />
  <link rel="stylesheet" href="/CSS/cap-bac.css" />
</head>
<body>
  <div id="site-header"></div>

  <main>
    <div class="container rank-page">
      <div class="rank-card">

        <div class="rank-top">
          <div class="rank-side rank-side-cur" id="rankLogoCur"></div>
          <div class="rank-progress" id="rankProgress"></div>
          <div class="rank-side rank-side-next" id="rankLogoNext"></div>
        </div>

        <div class="rank-split">
          <section class="rank-panel rank-current" id="rankCurrent"></section>
          <section class="rank-panel rank-next" id="rankNext"></section>
        </div>

        <p class="rank-sub">Nạp Càng Nhiều, Cấp Bậc Càng Cao, Ưu Đãi Càng Lớn.</p>
      </div>
    </div>
  </main>

  <div id="site-footer"></div>
  <script>
(function(){
  var RANKS=[
    {name:"Thành Viên",need:0,        img:"/Uploads/Logo Vip/Vip 0.png", perks:["Mua Hàng Với Giá Niêm Yết","Nạp 100.000VND Để Lên VIP 1 Và Nhận Voucher"]},
    {name:"Đồng",      need:100000,   img:"/Uploads/Logo Vip/Vip 1.png", perks:["Huy hiệu VIP 1","Voucher Giảm 1% (Đơn Đầu Tiên Khi Lên Hạng)"]},
    {name:"Bạc",       need:500000,   img:"/Uploads/Logo Vip/Vip 2.png", perks:["Giảm 1% Khi Mua","Nhận Thông Báo Khi Có Hàng Mới","Xem Acc/Hàng Mới Sớm Hơn 2 Giờ","Voucher Giảm 2% (Đơn Đầu Tiên Khi Lên Hạng)"]},
    {name:"Vàng",      need:2000000,  img:"/Uploads/Logo Vip/Vip 3.png", perks:["Mã Giảm Giá 5k Khi Đến Sinh Nhật","Nhận Thông Báo Khi Có Khuyến Mãi","Giảm 2% Khi Mua","Voucher Giảm 3% (Đơn Đầu Tiên Khi Lên Hạng)"]},
    {name:"Kim Cương", need:5000000,  img:"/Uploads/Logo Vip/Vip 4.png", perks:["Đặt Trước Hàng (Không Quá 7 Món)","Giảm 3% Khi Mua","Voucher Giảm 4% (Đơn Đầu Tiên Khi Lên Hạng)","Ưu Tiên Xử Lý Đơn Và Bảo Hành"]},
    {name:"Cao Cấp",   need:10000000, img:"/Uploads/Logo Vip/Vip 5.png", perks:["Hỗ Trợ Riêng","Giá Sỉ Cho Đơn Lớn","Quà Tặng Mỗi 2 Tuần","Giảm 4% Khi Mua","Voucher Giảm 5% (Đơn Đầu Tiên Khi Lên Hạng)"]}
  ];

  var total=0;

  function init(){

  function money(n){ return n.toLocaleString("vi-VN")+"đ"; }
  function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }
  function perks(r){ return "<ul>"+r.perks.map(function(p){return "<li>"+esc(p)+"</li>";}).join("")+"</ul>"; }

  var cur=0;
  RANKS.forEach(function(r,i){ if(total>=r.need) cur=i; });
  var higher=RANKS.slice(cur+1);
  var idx=0;
  var r=RANKS[cur];

  var elLogoCur=document.getElementById("rankLogoCur");
  var elLogoNext=document.getElementById("rankLogoNext");
  var elProgress=document.getElementById("rankProgress");
  var elCur=document.getElementById("rankCurrent");
  var elNext=document.getElementById("rankNext");

  elLogoCur.innerHTML=
    '<div class="rank-icon"><img src="'+r.img+'" alt="'+esc(r.name)+'"></div>'+
    '<h3>'+esc(r.name)+'</h3>';

  elCur.innerHTML=
    '<span class="rank-tag rank-tag-cur">QUYỀN LỢI HIỆN TẠI</span>'+
    perks(r)+
    '<div class="rank-note">Tổng Tiền Đã Nạp Của Bạn: <b>'+money(total)+'</b></div>';

  function renderNext(){
    if(!higher.length){
      elLogoNext.innerHTML=
        '<div class="rank-icon rank-icon-max">🏆</div>'+
        '<h3>Cao nhất</h3>'+
        '<p class="rank-need">Bạn đã đạt tối đa</p>';
      elProgress.innerHTML=
        '<div class="rank-progress-top">Bạn đã đạt <b>cấp bậc cao nhất</b></div>'+
        '<div class="rank-bar"><i style="width:100%"></i></div>'+
        '<div class="rank-bar-row"><span>'+money(total)+'</span><span></span></div>';
      elNext.classList.add("rank-max");
      elNext.innerHTML=
        '<span class="rank-tag rank-tag-next">QUYỀN LỢI VIP TIẾP THEO</span>'+
        '<div class="rank-max-box"><div class="rank-max-ico">🏆</div>'+
        '<p class="rank-need">Cảm ơn bạn đã đồng hành cùng LPTSHOP!</p></div>';
      return;
    }
    var n=higher[idx];
    var multi=higher.length>1;
    var pct=Math.max(0,Math.min(100,Math.round(total/n.need*100)));

    elLogoNext.innerHTML=
      '<div class="rank-icon rank-icon-next"><img src="'+n.img+'" alt="'+esc(n.name)+'"></div>'+
      '<h3>'+esc(n.name)+'</h3>';

    elProgress.innerHTML=
      '<div class="rank-progress-top">Cần nạp thêm <b>'+money(n.need-total)+'</b> để lên <b>'+esc(n.name)+'</b></div>'+
      '<div class="rank-bar"><i style="width:'+pct+'%"></i></div>'+
      '<div class="rank-bar-row"><span>'+money(total)+'</span><span>'+money(n.need)+'</span></div>';

    var dots=multi?'<div class="rank-dots">'+higher.map(function(_,i){return '<i class="'+(i===idx?"on":"")+'"></i>';}).join("")+'</div>':"";

    var title=idx===0?"QUYỀN LỢI VIP TIẾP THEO":"QUYỀN LỢI VIP "+(RANKS.indexOf(n)+1);
    elNext.innerHTML=
      '<div class="rank-tag-row">'+
        (multi?'<button type="button" class="rank-nav" data-dir="-1" aria-label="Xem quyền lợi cấp trước"'+(idx===0?' disabled':'')+'>‹</button>':'')+
        '<span class="rank-tag rank-tag-next">'+title+'</span>'+
        (multi?'<button type="button" class="rank-nav" data-dir="1" aria-label="Xem quyền lợi cấp sau"'+(idx===higher.length-1?' disabled':'')+'>›</button>':'')+
      '</div>'+
      perks(n)+dots;
  }

  elNext.addEventListener("click",function(e){
    var b=e.target.closest(".rank-nav");
    if(!b||b.disabled) return;
    idx=Math.max(0,Math.min(higher.length-1,idx+Number(b.dataset.dir)));
    renderNext();
  });
  renderNext();
  }

  fetch("/api/auth/profile",{credentials:"same-origin"})
    .then(function(r){ return r.ok?r.json():null; })
    .then(function(d){ if(d&&isFinite(Number(d.totalDeposit))) total=Math.max(0,Number(d.totalDeposit)); })
    .catch(function(){})
    .then(init);
})();
</script>
  <script src="/JS/layout.js"></script>
</body>
</html>
